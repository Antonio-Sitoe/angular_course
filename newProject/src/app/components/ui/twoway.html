@if (toggle) {
<h1 class="text-white">Mudou alguma coisa: {{ name }}</h1>
} @else {
<h1 class="text-white">Nada mudou: {{ name }}</h1>
}

<input
  type="text"
  placeholder="Digite seu nome"
  class="border-2 border-gray-300 rounded-md p-2 text-white"
  [ngModel]="name"
/>

<app-button (onClick)="onActionButtonClick()">Click me</app-button>
