<div class="flex h-screen">
  <div class="flex flex-col h-full w-[70%]">
    <div class="grow">
      <app-filter />
    </div>
    <div class="h-[80%]">
      <app-users-list [usersList]="usersList" (userSelected)="onUserSelected($event)"/>
    </div>
  </div>
  <div class="w-[30%] max-h-screen">
    @if(selectedUser) { 
    <app-user-details [user]="selectedUser" />
    }
  </div>
</div>
