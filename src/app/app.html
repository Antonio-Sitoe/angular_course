<div class="flex h-screen flex-col items-center p-4 gap-4">
  <div class="w-full grid container">
    <div class="p-4 max-w-7xl mx-auto">
      <mat-card>
        <mat-card-content>
          <div class="p-4 bg-orange-400">
            <app-users-list [usersList]="usersList()" />
          </div>
          <div class="p-4 bg-green-400">
            <mat-tab-group [selectedIndex]="currentTab">
              <mat-tab label="Dados Gerais" (selectedChange)="currentTab = 0">
                <app-general-informations [user]="usersList()[1]" />
              </mat-tab>
              <mat-tab label="Contato" (selectedChange)="currentTab = 1">
                <app-country-contact-information [user]="usersList()[1]" />
              </mat-tab>
              <mat-tab label="Dependentes" (selectedChange)="currentTab = 2"> Content 3 </mat-tab>
            </mat-tab-group>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
