<div class="flex h-screen flex-col items-center p-4 gap-4">
  <div class="w-full grid container">
    <div class="p-4 max-w-7xl mx-auto">
      <mat-card>
        <mat-card-content>
          <div class="p-4">
            <app-users-list
              [usersList]="usersList()"
              [selectedUser]="selectedUser()"
              (userSelected)="onUserSelected($event)"
            />
          </div>
          <div class="p-4">
            @if (selectedUser(); as user) {
              <mat-tab-group [selectedIndex]="currentTab">
                <mat-tab label="Dados Gerais" (selectedChange)="currentTab = 0">
                  <app-general-informations [user]="user" />
                </mat-tab>
                <mat-tab label="Contato" (selectedChange)="currentTab = 1">
                  <app-country-contact-information [user]="user" />
                </mat-tab>
                <mat-tab label="Dependentes" (selectedChange)="currentTab = 2">
                  <app-country-dependesses-list [dependentsList]="user.dependentsList" />
                </mat-tab>
              </mat-tab-group>
            } @else {
              <p class="text-sm text-gray-700">Carregando dados do usuário...</p>
            }
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
