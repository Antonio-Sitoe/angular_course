<div class="flex h-screen flex-col items-center p-4 gap-4">
  <div class="mt-4">
    <h2 class="text-2xl font-bold">Bem-vindo ao Dashboard Financeiro</h2>
  </div>
  <div class="w-full grid container">
    <h3 class="text-xl font-semibold mb-2">Digite seu nome: {{ name }}</h3>
    <div class="w-full max-w-sm">
      <input
        type="text"
        ngModel
        #meuInputFormControl="ngModel"
        required
        class="h-9 w-full min-w-0 rounded-lg border-none bg-white px-4 text-gray-900 shadow-xs ring-1 ring-black/10 outline-hidden placeholder:text-gray-400 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:bg-zinc-900 dark:text-gray-100 dark:placeholder:text-gray-500"
      />
      @if (meuInputFormControl.touched) {
        <p class="text-red-500 text-sm mt-1">O campo foi tocado.</p>
      }
      <p>Valido: {{ meuInputFormControl.valid }}</p>
    </div>
    <p>Tem conteudo: {{ meuInputFormControl.dirty }}</p>
    <button
      (click)="nameInput.control.markAsTouched()"
      class="bg-amber-800 text-white p-3 rounded-md mt-3"
    >
      Marcar como tocado
    </button>
  </div>
</div>
