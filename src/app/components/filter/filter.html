<div class="filter">
  <div class="flex items-start justify-between gap-4 px-4 py-6">
    <div class="form__name">
      <label for="nameInput" class="block text-sm font-medium text-gray-700 mb-1"> Nome </label>
      <input
        id="nameInput"
        type="text"
        placeholder="Ex. Fulano da Silva"
        [(ngModel)]="filterOptions.name"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div class="form__date-picker">
      <app-date-range-picker
        label="Data de Cadastro"
        placeholder="MM/DD/YYYY – MM/DD/YYYY"
        [(startDate)]="filterOptions.startDate"
        [(endDate)]="filterOptions.endDate"
      ></app-date-range-picker>
    </div>

    <div class="form__status">
      <label for="statusSelect" class="block text-sm font-medium text-gray-700 mb-1">
        Status
      </label>
      <select
        id="statusSelect"
        [(ngModel)]="filterOptions.status"
        name="status"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
      >
        @for (status of statusList; track status.value) {
        <option [value]="status.value">
          {{ status.description }}
        </option>
        }
      </select>
    </div>

    <div class="form__button">
      <button
        type="button"
        (click)="onFilter()"
        class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
      >
        Filtrar
      </button>
    </div>
  </div>
</div>
