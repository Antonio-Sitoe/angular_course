<div class="todos-header">
  <h2>Lista de Usuários</h2>
</div>
<div class="grid gap-4 mt-6">
  @for (user of (userList$ | async) ?? []; track user.id) {
    <app-card
      title="{{ user.name }}"
      description="{{ user.email }}"
      (actionClick)="onUserActionClick(user.id)"
      action="Acessar detalhes"
    >
      <p><span class="font-bold">Empresa: </span>{{ user.company.name }}</p>
    </app-card>
  }
</div>
