<div class="min-h-screen bg-linear-to-br from-slate-50 to-slate-100 p-6 sm:p-4">
  <div class="max-w-3xl mx-auto">
    @if (isLoading()) {
      <div class="flex flex-col items-center justify-center min-h-96 gap-4 text-slate-500">
        <div
          class="w-10 h-10 border-3 border-slate-300 border-t-blue-600 rounded-full animate-spin"
        ></div>
        <p class="text-lg">Carregando post...</p>
      </div>
    } @else if (error()) {
      <div class="bg-white rounded-lg shadow-sm border border-red-300 p-8">
        <div class="flex items-center gap-3 mb-4">
          <div class="text-2xl">⚠️</div>
          <h2 class="text-xl font-semibold text-red-900">Erro</h2>
        </div>
        <p class="text-red-800 mb-6">{{ error() }}</p>
        <button
          (click)="goBack()"
          class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-900 rounded-lg font-medium transition-colors"
        >
          ← Voltar
        </button>
      </div>
    } @else if (post()) {
      <button
        (click)="goBack()"
        class="mb-6 inline-flex items-center gap-2 px-4 py-2 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded-lg transition-all font-medium"
      >
        ← Voltar para posts
      </button>

      <article class="bg-white rounded-xl shadow-md overflow-hidden">
        <!-- Header -->
        <div class="bg-linear-to-r from-blue-600 to-blue-700 px-8 py-12 text-white">
          <div class="flex items-start gap-4 mb-4">
            <div class="text-5xl">📄</div>
            <div class="flex-1">
              <h1 class="text-3xl font-bold m-0 leading-tight">{{ post()!.title }}</h1>
              <p class="text-blue-100 m-0 mt-2">Post #{{ post()!.id }}</p>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div class="px-8 py-8">
          <div class="mb-8">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">Conteúdo</h2>
            <div class="bg-slate-50 rounded-lg p-6 border border-slate-200">
              <p class="text-slate-700 leading-relaxed whitespace-pre-wrap m-0">
                {{ post()!.body }}
              </p>
            </div>
          </div>

          <!-- Meta Info -->
          <div class="grid grid-cols-2 gap-4 sm:grid-cols-1">
            <div class="bg-blue-50 rounded-lg p-4 border border-blue-200">
              <p class="text-xs font-semibold text-blue-600 uppercase tracking-wide m-0">Autor</p>
              <p class="text-lg font-semibold text-blue-900 m-0 mt-2">
                Usuário #{{ post()!.userId }}
              </p>
            </div>
            <div class="bg-green-50 rounded-lg p-4 border border-green-200">
              <p class="text-xs font-semibold text-green-600 uppercase tracking-wide m-0">Tipo</p>
              <p class="text-lg font-semibold text-green-900 m-0 mt-2">Artigo</p>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div
          class="bg-slate-50 px-8 py-4 border-t border-slate-200 flex items-center justify-between"
        >
          <span class="text-sm text-slate-600">Post completo</span>
          <button
            (click)="goBack()"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors"
          >
            Voltar
          </button>
        </div>
      </article>
    }
  </div>
</div>
