<div class="w-full p-4">
  <h3 class="text-lg font-semibold text-gray-800">Músicas</h3>

  <form [formGroup]="musicsForm" (ngSubmit)="submit()">
    <div formArrayName="musics" class="space-y-2">
      @for (music of musics.controls; track $index; let i = $index) {
        <div [formGroupName]="i" class="flex gap-2">
          <input
            type="text"
            placeholder="Nome da música"
            formControlName="name"
            class="border border-gray-300 rounded-md py-2 px-4 w-full"
            (keypress)="adicionarItemOnEnter($event)"
          />

          <button type="button" (click)="removerItem(i)" class="bg-red-500 text-white px-3 rounded">
            X
          </button>
        </div>
      }
    </div>

    <button
      type="button"
      (click)="adicionarItem()"
      class="mt-3 bg-blue-500 text-white py-2 px-4 rounded"
    >
      Adicionar Música
    </button>

    <button type="submit" class="mt-3 ml-2 bg-green-600 text-white py-2 px-4 rounded">
      Salvar
    </button>
  </form>
</div>
