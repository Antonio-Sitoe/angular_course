<form [formGroup]="musicasForm">
  <div formArrayName="musicas" class="space-y-2 w-full">
    @for (musica of musicas.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="flex gap-2 w-full">
        <div class="flex flex-col">
          <label for="">Titulo </label>
          <input
            type="text"
            placeholder="Nome da música"
            formControlName="titulo"
            class="border border-gray-300 rounded-md py-2 px-4 w-full"
            (keypress)="adicionarItemOnEnter($event)"
          />
        </div>
        <div class="flex flex-col">
          <label for="">Banda </label>
          <input
            type="text"
            placeholder="Nome da banda"
            formControlName="banda"
            class="border border-gray-300 rounded-md py-2 px-4 w-full"
            (keypress)="adicionarItemOnEnter($event)"
          />
        </div>
        <div class="grid">
          <div></div>
          <button type="button" (click)="removerItem(i)" class="bg-red-500 text-white px-3 rounded">
            X
          </button>
        </div>
      </div>
    }
  </div>

  <button
    type="button"
    (click)="adicionarItem()"
    class="mt-3 bg-blue-500 text-white py-2 px-4 rounded"
  >
    Adicionar Música
  </button>
</form>
