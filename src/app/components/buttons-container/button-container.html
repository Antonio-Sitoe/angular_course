<div class="flex items-center justify-end gap-4 p-4">
  @if (!isInEditMode) {
    <button
      (click)="emitEditButton()"
      class="rounded-md px-3 py-2 leading-5 text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-500"
    >
      Editar
    </button>
  } @else {
    <button
      (click)="emitCancelButton()"
      class="rounded-md px-3 py-2 leading-5 text-lg font-medium text-white bg-red-600 hover:bg-red-500"
    >
      Cancelar
    </button>
    <button
      (click)="emitSaveButton()"
      class="rounded-md px-3 py-2 leading-5 text-lg font-medium text-white bg-green-600 hover:bg-green-500"
    >
      Salvar
    </button>
  }
</div>
