<form class="grid lg:grid-cols-3 lg:gap-4">
  <ng-container formGroupName="contactInformations">
    <mat-form-field class="w-full">
      <mat-label>Residencial:</mat-label>
      <input
        matInput
        placeholder="+55 11 1234-1234"
        value="+55 11 1234-1234"
        mask="+00 00 0000-0000"
      />
    </mat-form-field>
    <mat-form-field class="w-full">
      <mat-label>Celular:</mat-label>
      <input
        matInput
        placeholder="+55 11 91234-1234"
        value="+55 11 91234-1234"
        mask="+00 00 0000-0000"
      />
    </mat-form-field>
    <mat-form-field class="w-full">
      <mat-label>Emergência:</mat-label>
      <input
        matInput
        placeholder="+55 11 91234-1234"
        value="+55 11 91234-1234"
        mask="+00 00 0000-0000"
      />
    </mat-form-field>
  </ng-container>
</form>
