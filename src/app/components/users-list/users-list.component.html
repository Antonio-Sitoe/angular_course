<div class="p-4 grid sm:grid-cols-3 md:grid-cols-2 lg:grid-cols-3 gap-4">
  @for (user of usersList; track user.name) {
    <mat-card>
      <mat-card-content>
        <div class="p-4 bg-orange-400">
          <mat-card-title>
            <h2>Usuários {{ user.name }}</h2>
          </mat-card-title>
          <mat-card-subtitle>
            <p>{{ user.email }}</p>
          </mat-card-subtitle>
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
