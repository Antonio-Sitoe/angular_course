<form #meuForm="ngForm" (ngSubmit)="onSubmit(meuForm)" class="grid gap-4">
  <label for="name">Name:</label>
  <input type="text" id="name" ngModel name="name" class="border border-gray-200 h-10 px-2" />

  <label for="email">Email:</label>
  <input type="email" id="email" ngModel name="email" class="border border-gray-200 h-10 px-2" />

  <button type="submit" class="bg-amber-600 text-white h-10 rounded">Enviar</button>
</form>
